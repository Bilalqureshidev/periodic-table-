<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table of Elements</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  color: #60e1f5;
  margin-bottom: 10px;
}

header p {
  color: #cbd5e1;
}

.table-wrap {
  max-width: 1500px;
  margin: auto;
  overflow-x: auto;
  padding-bottom: 15px;
}

.periodic-table {
  display: grid;
  grid-template-columns: repeat(18, minmax(58px, 1fr));
  gap: 5px;
  min-width: 1120px;
}

.element {
  min-height: 78px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 7px;
  padding: 5px 3px;
  text-align: center;
  color: #111827;
  transition: transform .2s, box-shadow .2s;
}

.element:hover {
  transform: scale(1.08);
  box-shadow: 0 4px 15px #0008;
  z-index: 2;
}

.number {
  display: block;
  text-align: left;
  font-size: 10px;
}

.symbol {
  display: block;
  font-size: 21px;
  font-weight: bold;
  margin: 5px 0;
}

.name {
  display: block;
  font-size: 9px;
  overflow-wrap: anywhere;
}

.alkali { background: #ff9b9b; }
.alkaline { background: #ffc477; }
.transition { background: #ffe58f; }
.post-transition { background: #a7e8bd; }
.metalloid { background: #78dfd2; }
.nonmetal { background: #91c8ff; }
.halogen { background: #c5b5ff; }
.noble { background: #f2b4ec; }
.lanthanide { background: #f8b4d9; }
.actinide { background: #d8b4fe; }

.series-title {
  grid-column: 1 / -1;
  padding: 8px;
  margin-top: 12px;
  color: #60e1f5;
  font-weight: bold;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 25px auto;
  max-width: 1000px;
}

.legend span {
  padding: 8px 10px;
  border-radius: 5px;
  color: #111827;
  font-size: 12px;
}

footer {
  text-align: center;
  color: #94a3b8;
  margin-top: 25px;
  font-size: 13px;
}

@media (max-width: 600px) {
  body { padding: 10px; }
  header h1 { font-size: 24px; }
}
</style>
</head>

<body>
<header>
  <h1>Periodic Table of Elements</h1>
  <p>Explore all 118 chemical elements</p>
</header>

<div class="table-wrap">
  <div class="periodic-table" id="table"></div>
</div>

<div class="legend">
  <span class="alkali">Alkali Metal</span>
  <span class="alkaline">Alkaline Earth</span>
  <span class="transition">Transition Metal</span>
  <span class="post-transition">Post-transition Metal</span>
  <span class="metalloid">Metalloid</span>
  <span class="nonmetal">Nonmetal</span>
  <span class="halogen">Halogen</span>
  <span class="noble">Noble Gas</span>
</div>

<footer>
  <p>Periodic Table Project | HTML, CSS & JavaScript</p>
</footer>

<script>
const elements = [
["H","Hydrogen","nonmetal"],["He","Helium","noble"],
["Li","Lithium","alkali"],["Be","Beryllium","alkaline"],
["B","Boron","metalloid"],["C","Carbon","nonmetal"],
["N","Nitrogen","nonmetal"],["O","Oxygen","nonmetal"],
["F","Fluorine","halogen"],["Ne","Neon","noble"],
["Na","Sodium","alkali"],["Mg","Magnesium","alkaline"],
["Al","Aluminium","post-transition"],["Si","Silicon","metalloid"],
["P","Phosphorus","nonmetal"],["S","Sulfur","nonmetal"],
["Cl","Chlorine","halogen"],["Ar","Argon","noble"],
["K","Potassium","alkali"],["Ca","Calcium","alkaline"],
["Sc","Scandium","transition"],["Ti","Titanium","transition"],
["V","Vanadium","transition"],["Cr","Chromium","transition"],
["Mn","Manganese","transition"],["Fe","Iron","transition"],
["Co","Cobalt","transition"],["Ni","Nickel","transition"],
["Cu","Copper","transition"],["Zn","Zinc","transition"],
["Ga","Gallium","post-transition"],["Ge","Germanium","metalloid"],
["As","Arsenic","metalloid"],["Se","Selenium","nonmetal"],
["Br","Bromine","halogen"],["Kr","Krypton","noble"],
["Rb","Rubidium","alkali"],["Sr","Strontium","alkaline"],
["Y","Yttrium","transition"],["Zr","Zirconium","transition"],
["Nb","Niobium","transition"],["Mo","Molybdenum","transition"],
["Tc","Technetium","transition"],["Ru","Ruthenium","transition"],
["Rh","Rhodium","transition"],["Pd","Palladium","transition"],
["Ag","Silver","transition"],["Cd","Cadmium","transition"],
["In","Indium","post-transition"],["Sn","Tin","post-transition"],
["Sb","Antimony","metalloid"],["Te","Tellurium","metalloid"],
["I","Iodine","halogen"],["Xe","Xenon","noble"],
["Cs","Cesium","alkali"],["Ba","Barium","alkaline"],
["La","Lanthanum","lanthanide"],["Ce","Cerium","lanthanide"],
["Pr","Praseodymium","lanthanide"],["Nd","Neodymium","lanthanide"],
["Pm","Promethium","lanthanide"],["Sm","Samarium","lanthanide"],
["Eu","Europium","lanthanide"],["Gd","Gadolinium","lanthanide"],
["Tb","Terbium","lanthanide"],["Dy","Dysprosium","lanthanide"],
["Ho","Holmium","lanthanide"],["Er","Erbium","lanthanide"],
["Tm","Thulium","lanthanide"],["Yb","Ytterbium","lanthanide"],
["Lu","Lutetium","lanthanide"],
["Hf","Hafnium","transition"],["Ta","Tantalum","transition"],
["W","Tungsten","transition"],["Re","Rhenium","transition"],
["Os","Osmium","transition"],["Ir","Iridium","transition"],
["Pt","Platinum","transition"],["Au","Gold","transition"],
["Hg","Mercury","transition"],["Tl","Thallium","post-transition"],
["Pb","Lead","post-transition"],["Bi","Bismuth","post-transition"],
["Po","Polonium","post-transition"],["At","Astatine","halogen"],
["Rn","Radon","noble"],["Fr","Francium","alkali"],
["Ra","Radium","alkaline"],
["Ac","Actinium","actinide"],["Th","Thorium","actinide"],
["Pa","Protactinium","actinide"],["U","Uranium","actinide"],
["Np","Neptunium","actinide"],["Pu","Plutonium","actinide"],
["Am","Americium","actinide"],["Cm","Curium","actinide"],
["Bk","Berkelium","actinide"],["Cf","Californium","actinide"],
["Es","Einsteinium","actinide"],["Fm","Fermium","actinide"],
["Md","Mendelevium","actinide"],["No","Nobelium","actinide"],
["Lr","Lawrencium","actinide"],
["Rf","Rutherfordium","transition"],["Db","Dubnium","transition"],
["Sg","Seaborgium","transition"],["Bh","Bohrium","transition"],
["Hs","Hassium","transition"],["Mt","Meitnerium","transition"],
["Ds","Darmstadtium","transition"],["Rg","Roentgenium","transition"],
["Cn","Copernicium","transition"],["Nh","Nihonium","post-transition"],
["Fl","Flerovium","post-transition"],["Mc","Moscovium","post-transition"],
["Lv","Livermorium","post-transition"],["Ts","Tennessine","halogen"],
["Og","Oganesson","noble"]
];

const positions = [
[1,1,1],[2,1,18],
[3,2,1],[4,2,2],[5,2,13],[6,2,14],[7,2,15],[8,2,16],[9,2,17],[10,2,18],
[11,3,1],[12,3,2],[13,3,13],[14,3,14],[15,3,15],[16,3,16],[17,3,17],[18,3,18],
[19,4,1],[20,4,2],[21,4,3],[22,4,4],[23,4,5],[24,4,6],[25,4,7],[26,4,8],[27,4,9],[28,4,10],[29,4,11],[30,4,12],[31,4,13],[32,4,14],[33,4,15],[34,4,16],[35,4,17],[36,4,18],
[37,5,1],[38,5,2],[39,5,3],[40,5,4],[41,5,5],[42,5,6],[43,5,7],[44,5,8],[45,5,9],[46,5,10],[47,5,11],[48,5,12],[49,5,13],[50,5,14],[51,5,15],[52,5,16],[53,5,17],[54,5,18],
[55,6,1],[56,6,2],[72,6,4],[73,6,5],[74,6,6],[75,6,7],[76,6,8],[77,6,9],[78,6,10],[79,6,11],[80,6,12],[81,6,13],[82,6,14],[83,6,15],[84,6,16],[85,6,17],[86,6,18],
[87,7,1],[88,7,2],[104,7,4],[105,7,5],[106,7,6],[107,7,7],[108,7,8],[109,7,9],[110,7,10],[111,7,11],[112,7,12],[113,7,13],[114,7,14],[115,7,15],[116,7,16],[117,7,17],[118,7,18]
];

const table = document.getElementById("table");

function addElement(atomicNumber, row, column) {
  const data = elements[atomicNumber - 1];
  const cell = document.createElement("div");
  cell.className = "element " + data[2];
  cell.style.gridRow = row;
  cell.style.gridColumn = column;
  cell.innerHTML = `
    <span class="number">${atomicNumber}</span>
    <span class="symbol">${data[0]}</span>
    <span class="name">${data[1]}</span>`;
  cell.title = data[1];
  table.appendChild(cell);
}

positions.forEach(([number, row, column]) => {
  addElement(number, row, column);
});

function addSeries(title, numbers, row, className) {
  const heading = document.createElement("div");
  heading.className = "series-title";
  heading.style.gridRow = row;
  heading.textContent = title;
  table.appendChild(heading);

  numbers.forEach((number, index) => {
    const data = elements[number - 1];
    const cell = document.createElement("div");
    cell.className = "element " + className;
    cell.style.gridRow = row + 1;
    cell.style.gridColumn = index + 4;
    cell.innerHTML = `
      <span class="number">${number}</span>
      <span class="symbol">${data[0]}</span>
      <span class="name">${data[1]}</span>`;
    cell.title = data[1];
    table.appendChild(cell);
  });
}

addSeries("Lanthanides (57–71)", Array.from({length:15},(_,i)=>57+i), 8, "lanthanide");
addSeries("Actinides (89–103)", Array.from({length:15},(_,i)=>89+i), 10, "actinide");
</script>
</body>
</html>
